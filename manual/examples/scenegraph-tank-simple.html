<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, user-scalable=yes"
		/>
		<title>Three.js - 简易 Tank 场景图</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}
			#c {
				width: 100%;
				height: 100%;
				display: block;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
	</body>
	<script type="importmap">
		{
			"imports": {
				"three": "../../build/three.module.js",

				"three/addons/": "../../examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from "three";
		import { OrbitControls } from "three/addons/controls/OrbitControls.js";
		import { VertexNormalsHelper } from "three/addons/helpers/VertexNormalsHelper.js";

		function main() {
			let tank = null;
			const roadPoints = [];

			const canvas = document.querySelector("#c");

			const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
			renderer.setClearColor(0xaaaaaa);

			const scene = new THREE.Scene();

			const axesHelper = new THREE.AxesHelper(5);
			scene.add(axesHelper);

			const camera = new THREE.PerspectiveCamera(
				40,
				canvas.clientWidth / canvas.clientHeight,
				0.1,
				1000,
			);
			camera.position.set(8, 4, 10).multiplyScalar(3);
			camera.lookAt(0, 0, 0);

			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 0, 0);
			controls.update();

			let light = new THREE.DirectionalLight(0xffffff, 3);
			light.position.set(0, 20, 0);
			scene.add(light);
			// light.castShadow = true;
			// light.shadow.mapSize.width = 2048;
			// light.shadow.mapSize.height = 2048;

			light = new THREE.DirectionalLight(0xffffff, 3);
			light.position.set(1, 2, 4);
			scene.add(light);

			createGround();
			createTank();
			creatRoad();
			createTargetBall();

			function createGround() {
				const geometry = new THREE.PlaneGeometry(50, 50);
				const material = new THREE.MeshPhongMaterial({ color: 0xcc8866 });
				const ground = new THREE.Mesh(geometry, material);
				ground.rotation.x = Math.PI * -0.5;
				scene.add(ground);
			}

			function createTank() {
				tank = new THREE.Object3D();
				scene.add(tank);

				const bodyGeometry = new THREE.BoxGeometry(4, 1, 8);
				const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x6688aa });
				const bodyMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
				bodyMesh.position.y = 0.5;
				tank.add(bodyMesh);
				const helper = new VertexNormalsHelper(bodyMesh, 1, 0xff0000);
				scene.add(helper);
			}

			function creatRoad() {
				roadPoints.push(new THREE.Vector2(0, 0));
				roadPoints.push(new THREE.Vector2(20, 0));
				roadPoints.push(new THREE.Vector2(20, -20));
				roadPoints.push(new THREE.Vector2(0, -20));
				roadPoints.push(new THREE.Vector2(-20, -20));
				roadPoints.push(new THREE.Vector2(-20, 0));
				roadPoints.push(new THREE.Vector2(-20, 20));
				roadPoints.push(new THREE.Vector2(0, 20));
				roadPoints.push(new THREE.Vector2(20, 20));
				roadPoints.push(new THREE.Vector2(0, 0));

				const material = new THREE.LineBasicMaterial({ color: 0xff0000 });
				const geometry = new THREE.BufferGeometry().setFromPoints(roadPoints);
				const line = new THREE.Line(geometry, material);
				line.rotation.x = Math.PI * 0.5;
				line.position.y = 0.05;
				scene.add(line);
			}

			function createTargetBall() {
				const targetGeometry = new THREE.SphereGeometry(0.5, 6, 3);
				const targetMaterial = new THREE.MeshPhongMaterial({
					color: 0x00ff00,
					flatShading: true,
				});
				const targetMesh = new THREE.Mesh(targetGeometry, targetMaterial);
				targetMesh.position.y = 10;
				scene.add(targetMesh);
				
				const helper = new VertexNormalsHelper(targetMesh, 1, 0xff0000);
				scene.add(helper);
			}

			function render(time) {
				time *= 0.001;

				if (resizeRendererToDisplaySize(renderer)) {
					camera.aspect = canvas.clientWidth / canvas.clientHeight;
					camera.updateProjectionMatrix();
				}

				// {
				// 	const tankTime = time * 0.05;
				// 	const _index = ((tankTime % 1) * 10) | 0;
				// 	const tankPos = roadPoints[_index];
				// 	const tankTarget = roadPoints[(_index + 1) % roadPoints.length];
				// 	tank.position.set(tankPos.x, 0, tankPos.y);
				// 	tank.lookAt(tankTarget.x, 0, tankTarget.y);

				// 	// roadPoints.getPointAt(tankTime % 1, tankPosition);
				// 	// roadPoints.getPointAt((tankTime + 0.01) % 1, tankTarget);
				// }

				// 如果controls开启了惯性或自动旋转等需要持续计算的功能时，这里必须调用
				// controls.update();
				renderer.render(scene, camera);
				requestAnimationFrame(render);
			}

			function resizeRendererToDisplaySize(renderer) {
				const canvas = renderer.domElement;
				const width = canvas.clientWidth;
				const height = canvas.clientHeight;
				const needResize = canvas.width !== width || canvas.height !== height;
				if (needResize) {
					renderer.setSize(width, height, false);
				}

				return needResize;
			}

			requestAnimationFrame(render);
		}

		main();
	</script>
</html>
