<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, user-scalable=yes"
		/>
		<title>Three.js - Lots of Objects - Slow</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}
			#c {
				width: 100%;
				height: 100%;
				display: block;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
	</body>
	<script type="importmap">
		{
			"imports": {
				"three": "../../build/three.module.js",
				"three/addons/": "../../examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from "three";
		import { OrbitControls } from "three/addons/controls/OrbitControls.js";

		function main() {
			const canvas = document.querySelector("#c");
			const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });

			const fov = 60;
			const aspect = 2; // the canvas default
			const near = 0.1;
			const far = 10;
			const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
			camera.position.z = 2.5;

			const controls = new OrbitControls(camera, canvas);
			controls.enableDamping = true;
			controls.enablePan = false;
			controls.minDistance = 1.2;
			controls.maxDistance = 4;
			controls.update();

			const scene = new THREE.Scene();
			scene.background = new THREE.Color("black");

			{
				const loader = new THREE.TextureLoader();
				const texture = loader.load("resources/images/world.jpg", render);
				texture.colorSpace = THREE.SRGBColorSpace;
				const geometry = new THREE.SphereGeometry(1, 64, 32);
				const material = new THREE.MeshBasicMaterial({ map: texture });
				scene.add(new THREE.Mesh(geometry, material));
			}

			async function loadFile(url) {
				const req = await fetch(url);
				return req.text();
			}

			// 组织数据
			// settings={data:[],max:0,min:0,key1:value1,key2:value2,key3:value3}
			function parseData(text) {
				const data = [];
				const settings = { data };
				let max;
				let min;
				// split into lines
				// 使用换行符拆行
				text.split("\n").forEach((line) => {
					// split the line by whitespace
					// 使用空格拆分数据
					const parts = line.trim().split(/\s+/);
					if (parts.length === 2) {
						// only 2 parts, must be a key/value pair
						// 只有两个部分，肯定是键值对
						settings[parts[0]] = parseFloat(parts[1]);
					} else if (parts.length > 2) {
						// more than 2 parts, must be data
						const values = parts.map((v) => {
							const value = parseFloat(v); // 将字符串解析为浮点数
							if (value === settings.NODATA_value) {
								// value 是否 NODATA_value 标识返回undefined
								return undefined;
							}

							max = Math.max(max === undefined ? value : max, value); // 记录最大值
							min = Math.min(min === undefined ? value : min, value); // 记录最小值

							// 返回此数据本身
							return value;
						});
						data.push(values); // 此时 settings.data 是个二维数组
					}
				});

				const _settings = Object.assign(settings, { min, max });

				return _settings;
			}

			function addBoxes(file) {
				const { min, max, data } = file;
				const range = max - min; // 浮动范围

				// make one box geometry
				// 创建一个宽高深为1的盒子
				const boxWidth = 1;
				const boxHeight = 1;
				const boxDepth = 1;
				const geometry = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);
				// make it so it scales away from the positive Z axis
				// 修改几何中心点 从(0,0,0) 到 (0,0,0.5) 修改锚点 只朝着Z轴正方向增长
				geometry.applyMatrix4(new THREE.Matrix4().makeTranslation(0, 0, 0.5));

				// these helpers will make it easy to position the boxes We can rotate the lon helper on its Y axis to the longitude
				// 这些辅助工具将便于调整盒子的位置。我们可以绕Y轴旋转经度辅助工具，使其对准经度方向。
				const lonHelper = new THREE.Object3D();
				scene.add(lonHelper);
				// We rotate the latHelper on its X axis to the latitude
				// 我们将latHelper绕其X轴旋转至纬度位置
				const latHelper = new THREE.Object3D();
				lonHelper.add(latHelper);
				// The position helper moves the object to the edge of the sphere
				// 位置辅助器将对象移动到球体的边缘
				const positionHelper = new THREE.Object3D();
				positionHelper.position.z = 1;

				const axesHelper = new THREE.AxesHelper( 1 );
				positionHelper.add( axesHelper );
				latHelper.add(positionHelper);

				const lonFudge = Math.PI * 0.5;
				const latFudge = Math.PI * -0.135;
				data.forEach((row, latNdx) => {
					row.forEach((value, lonNdx) => {
						if (value === undefined) {
							return;
						}

						// 当前value到最小的范围 / 最大范围
						const amount = (value - min) / range;
						const material = new THREE.MeshBasicMaterial();
						// 按比例获取 0.7 ~ 0.3 之间的值当色相
						const hue = THREE.MathUtils.lerp(0.7, 0.3, amount);
						// 饱和度
						const saturation = 1;
						// 亮度
						const lightness = THREE.MathUtils.lerp(0.4, 1.0, amount);
						material.color.setHSL(hue, saturation, lightness);
						const mesh = new THREE.Mesh(geometry, material);
						scene.add(mesh);

						// adjust the helpers to point to the latitude and longitude
						// 调整helper以指向纬度和经度
						lonHelper.rotation.y = THREE.MathUtils.degToRad(lonNdx + file.xllcorner) + lonFudge;
						latHelper.rotation.x = THREE.MathUtils.degToRad(latNdx + file.yllcorner) + latFudge;

						// use the world matrix of the position helper to position this mesh.
						// 使用位置帮助器的世界矩阵来定位这个mesh
						// 更新positionHelper的世界矩阵  
						// .updateWorldMatrix( updateParents : boolean, updateChildren : boolean )
						positionHelper.updateWorldMatrix(true, false);
						// 将矩阵应用到mesh上，更新mesh位置
						mesh.applyMatrix4(positionHelper.matrixWorld);

						mesh.scale.set(
							0.005,
							0.005,
							THREE.MathUtils.lerp(0.01, 0.5, amount),
						);
					});
				});
			}

			loadFile(
				"resources/data/gpw/gpw_v4_basic_demographic_characteristics_rev10_a000_014mt_2010_cntm_1_deg.asc",
			) //拿到原始数据
				.then(parseData)
				.then(addBoxes)
				.then(render);

			function resizeRendererToDisplaySize(renderer) {
				const canvas = renderer.domElement;
				const width = canvas.clientWidth;
				const height = canvas.clientHeight;
				const needResize = canvas.width !== width || canvas.height !== height;
				if (needResize) {
					renderer.setSize(width, height, false);
				}

				return needResize;
			}

			let renderRequested = false;

			function render() {
				renderRequested = undefined;

				if (resizeRendererToDisplaySize(renderer)) {
					const canvas = renderer.domElement;
					camera.aspect = canvas.clientWidth / canvas.clientHeight;
					camera.updateProjectionMatrix();
				}

				controls.update();
				renderer.render(scene, camera);
			}

			render();

			function requestRenderIfNotRequested() {
				if (!renderRequested) {
					renderRequested = true;
					requestAnimationFrame(render);
				}
			}

			controls.addEventListener("change", requestRenderIfNotRequested);
			window.addEventListener("resize", requestRenderIfNotRequested);
		}

		main();
	</script>
</html>
